[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2a-utils"
dynamic = ["version"]
description = "A collection of utilities for discovering, communicating, and authenticating with A2A Servers"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
keywords = ["a2a", "agent-to-agent", "utilities"]
authors = [
  { name = "A2A Net", email = "hello@a2anet.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "a2a-sdk>=0.3.0",
    "httpx>=0.27.0",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "langchain>=1.2.15",
    "langchain-openai>=1.1.12",
    "mypy>=1.19.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.9",
]

[project.urls]
Documentation = "https://github.com/a2anet/a2a-utils#readme"
Issues = "https://github.com/a2anet/a2a-utils/issues"
Source = "https://github.com/a2anet/a2a-utils"

[tool.hatch.version]
path = "src/a2a_utils/__about__.py"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ == .__main__.:"]
