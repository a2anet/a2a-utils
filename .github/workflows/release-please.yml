name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      python-release_created: ${{ steps.release.outputs['python--release_created'] }}
      javascript-release_created: ${{ steps.release.outputs['javascript--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-python:
    name: Build Python Distribution
    needs: release-please
    if: needs.release-please.outputs.python-release_created == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build package
        run: uv build
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: python/dist/

  publish-python:
    name: Publish to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-python
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build-javascript:
    name: Build JavaScript Distribution
    needs: release-please
    if: needs.release-please.outputs.javascript-release_created == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build package
        run: bun run build
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-javascript
          path: javascript/dist/

  publish-javascript:
    name: Publish to npm
    needs: build-javascript
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-javascript
          path: javascript/dist/
      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: javascript
